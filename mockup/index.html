<title>Verga Portale Venditori</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Spectral+SC:wght@400;500;600&display=swap">
<style>
:root{
  --brand:#074d43; --brand-2:#007565; --brand-soft:#e7f0ed; --brand-soft-2:#d3e5df;
  --accent:#074d43; --on-accent:#ffffff;
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#f8faf9; --line:#dde5e2; --line-strong:#c4d1cc;
  --ink:#13231e; --muted:#586a64; --faint:#879690;
  --amber:#8a5d0c; --amber-bg:#fbf1dc; --red:#a3302b; --red-bg:#fbebea;
  --ok:#17704a; --ok-bg:#e2f2e9; --blue:#2a5a86; --blue-bg:#e7eff8;
  --side:#074d43; --side-2:#0a5a4e; --side-ink:#eaf3f0; --side-muted:#a3c7bd;
  --logo-a:#004d43; --logo-b:#007565; --side-hl:#bfe0d6;
  --shadow:0 1px 2px rgba(6,54,47,.05),0 6px 20px rgba(6,54,47,.07);
  --overlay:rgba(8,28,24,.45);
  --serif:'Spectral SC','Cormorant SC',Georgia,'Times New Roman',serif;
  --sans:'Montserrat','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --brand:#5db59f; --brand-2:#7cc8b4; --brand-soft:#15302a; --brand-soft-2:#1c3d35;
    --accent:#5db59f; --on-accent:#05201a;
    --bg:#0c1412; --surface:#131d1a; --surface-2:#172320; --line:#243430; --line-strong:#33463f;
    --ink:#e3ece9; --muted:#9bada7; --faint:#71847e;
    --amber:#e6b85c; --amber-bg:#2b2311; --red:#ef8a84; --red-bg:#331a19;
    --ok:#72d2a3; --ok-bg:#12291f; --blue:#90b9e1; --blue-bg:#142333;
    --side:#081f1b; --side-2:#0f2e28; --side-ink:#e3ece9; --side-muted:#86aaa0;
    --logo-a:#e3ece9; --logo-b:#8fcab9;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
    --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --brand:#5db59f; --brand-2:#7cc8b4; --brand-soft:#15302a; --brand-soft-2:#1c3d35;
  --accent:#5db59f; --on-accent:#05201a;
  --bg:#0c1412; --surface:#131d1a; --surface-2:#172320; --line:#243430; --line-strong:#33463f;
  --ink:#e3ece9; --muted:#9bada7; --faint:#71847e;
  --amber:#e6b85c; --amber-bg:#2b2311; --red:#ef8a84; --red-bg:#331a19;
  --ok:#72d2a3; --ok-bg:#12291f; --blue:#90b9e1; --blue-bg:#142333;
  --side:#081f1b; --side-2:#0f2e28; --side-ink:#e3ece9; --side-muted:#86aaa0;
  --logo-a:#e3ece9; --logo-b:#8fcab9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  --overlay:rgba(0,0,0,.6);
}
/* Area Riparazioni: stessa interfaccia, palette scura al posto del verde */
:root[data-area="rip"]{
  --brand:#24272b; --brand-2:#3a3e44; --brand-soft:#ececea; --brand-soft-2:#deddd9;
  --accent:#24272b; --on-accent:#ffffff;
  --bg:#f4f4f2; --surface-2:#f9f9f8; --line:#e0dfdb; --line-strong:#cac8c2;
  --ink:#1b1c1e; --muted:#5f6166; --faint:#8d8f93;
  --side:#1d1f22; --side-2:#2e3135; --side-ink:#eeeeec; --side-muted:#a2a4a8; --side-hl:#c9b27c;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.07);
  --overlay:rgba(16,17,19,.5);
}
@media (prefers-color-scheme: dark){
  :root[data-area="rip"]:not([data-theme="light"]){
    --brand:#c9b27c; --brand-2:#d8c597; --brand-soft:#26241f; --brand-soft-2:#302d26;
    --accent:#c9b27c; --on-accent:#1a1710;
    --bg:#111214; --surface:#18191c; --surface-2:#1c1e21; --line:#2a2c30; --line-strong:#383b40;
    --ink:#e8e8e6; --muted:#a3a5a9; --faint:#7a7c80;
    --side:#0b0c0d; --side-2:#1f2124; --side-ink:#e8e8e6; --side-muted:#8d8f93;
    --logo-a:#e8e8e6; --logo-b:#c9b27c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); --overlay:rgba(0,0,0,.6);
  }
}
:root[data-area="rip"][data-theme="dark"]{
  --brand:#c9b27c; --brand-2:#d8c597; --brand-soft:#26241f; --brand-soft-2:#302d26;
  --accent:#c9b27c; --on-accent:#1a1710;
  --bg:#111214; --surface:#18191c; --surface-2:#1c1e21; --line:#2a2c30; --line-strong:#383b40;
  --ink:#e8e8e6; --muted:#a3a5a9; --faint:#7a7c80;
  --side:#0b0c0d; --side-2:#1f2124; --side-ink:#e8e8e6; --side-muted:#8d8f93;
  --logo-a:#e8e8e6; --logo-b:#c9b27c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); --overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
.serif{font-family:var(--serif)}
.label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo svg{display:block;height:100%;width:auto}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px;gap:22px;--logo-a:#ffffff;--logo-b:var(--side-hl)}
.side-brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.side-brand .logo{height:42px}
.side-brand b{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.06em;line-height:1}
.side-brand small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:14px 12px 6px}
.nav button{all:unset;display:flex;align-items:center;gap:12px;padding:0 12px;height:42px;border-radius:8px;color:var(--side-ink);font-weight:500;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:var(--side-2);box-shadow:inset 3px 0 0 var(--side-hl)}
.nav button .badge{margin-left:auto;background:rgba(255,255,255,.16);border-radius:99px;font-size:11px;padding:1px 8px;font-weight:600}
.nav button:focus-visible{outline:2px solid var(--side-hl)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px}
.top .menu-btn{display:none}
.gsearch{position:relative;flex:3 1 0;max-width:620px;min-width:0}
.gsearch input{width:100%;height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:0 14px 0 42px}
.gsearch>svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.gs-drop{position:absolute;top:50px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;max-height:420px;overflow:auto}
.gs-drop .label{padding:6px 8px}
.gs-item{all:unset;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:8px;border-radius:8px;cursor:pointer}
.gs-item:hover,.gs-item:focus-visible{background:var(--brand-soft)}
.top-sp{flex:1 1 0}
.pill-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:99px;font-weight:500;white-space:nowrap}
.pill-btn select{border:0;background:transparent;font-weight:600;padding-right:4px}
.op{display:flex;align-items:center;gap:10px}
.content{padding:28px;display:flex;flex-direction:column;gap:24px;max-width:1440px;width:100%}

/* ---------- elements ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--brand-soft);border-color:transparent}
.btn-lg{height:48px;padding:0 20px;font-size:14.5px}
.btn-sm{height:32px;padding:0 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-soft-2);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;letter-spacing:.02em}
.av.lg{width:64px;height:64px;font-size:20px;font-family:var(--serif);font-weight:500}
.av.ghost{background:transparent;border:1.5px dashed var(--line-strong);color:var(--faint)}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag svg.i{width:13px;height:13px}
.tag.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.tag.amber{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.tag.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.tag.red{background:var(--red-bg);border-color:transparent;color:var(--red)}
.tag.blue{background:var(--blue-bg);border-color:transparent;color:var(--blue)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;font-weight:600;font-family:var(--sans)}
.card-h .sp{flex:1}
.card-b{padding:16px 20px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:12.5px;color:var(--muted)}
.row.click{cursor:pointer}
.row.click:hover{background:var(--surface-2)}
.link{all:unset;color:var(--accent);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}
.page-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-h h1{font-family:var(--serif);font-size:30px;line-height:1.1;letter-spacing:.01em}
.page-h .sp{flex:1}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:24px}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.field>span em{font-style:normal;color:var(--red)}
.in,.sel,.ta{height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:0 12px;width:100%;min-width:0}
.ta{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.in:focus,.sel:focus,.ta:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 16px}
.fsec{display:flex;flex-direction:column;gap:14px;padding:20px;border-bottom:1px solid var(--line)}
.fsec:last-child{border-bottom:0}
.fsec h3{font-size:14px;font-weight:600;font-family:var(--sans);display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.on svg.i{width:15px;height:15px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:78px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13px;padding:8px}
.seg button svg.i{width:22px;height:22px}
.seg button.on{border-color:var(--accent);background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px var(--accent)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.cell-person{display:flex;align-items:center;gap:12px;min-width:200px}
.cell-person b{display:block;font-weight:600}
.cell-person small{color:var(--muted);font-size:12px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;letter-spacing:.01em}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font-weight:500}
.banner.info{background:var(--brand-soft);color:var(--brand)}
.banner .grow{flex:1}
.banner p{margin:0}

/* dashboard */
.hello h1{font-family:var(--serif);font-size:32px;line-height:1.1}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.qa button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-height:128px}
.qa button:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.qa button:focus-visible{outline:2px solid var(--accent)}
.qa .ic{width:42px;height:42px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.qa .ic svg.i{width:22px;height:22px}
.qa b{font-size:15px;font-weight:600;display:block}
.qa small{color:var(--muted);font-size:12.5px;line-height:1.4;display:block;margin-top:2px}
.qa button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qa button.primary .ic{background:rgba(255,255,255,.14);color:inherit}
.qa button.primary small{color:inherit;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.kpi{padding:16px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.kpi:last-child{border-right:0}
.kpi b{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1}
.kpi.alert b{color:var(--amber)}

/* client */
.chead{display:flex;gap:20px;align-items:flex-start;padding:22px 24px;flex-wrap:wrap}
.chead .who{flex:1;min-width:260px;display:flex;flex-direction:column;gap:8px}
.chead h1{font-family:var(--serif);font-size:32px;line-height:1.05}
.chead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px}
.chead .meta span{display:inline-flex;align-items:center;gap:6px}
.chead .meta svg.i{width:15px;height:15px}
.oneclick{display:flex;flex-direction:column;gap:8px;min-width:280px}
.oneclick .label{margin-bottom:2px}
.oc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.oc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:66px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:12px;font-weight:600;padding:4px 6px;text-align:center;line-height:1.2}
.oc:hover{border-color:var(--accent);background:var(--brand-soft);color:var(--brand)}
.oc svg.i{width:20px;height:20px}
.lastline{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--line);background:var(--surface-2);font-size:13px;color:var(--muted);flex-wrap:wrap;border-radius:0 0 12px 12px}
.lastline b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:12px 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.tabs .n{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:6px;color:var(--muted)}
.pda{display:flex;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:flex-start}
.pda:last-child{border-bottom:0}
.pda .wm{width:46px;height:46px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.pda .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pda .ttl{font-weight:600;font-size:15px}
.spec{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted)}
.spec b{color:var(--ink);font-weight:600}
.pda .act{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.match{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ok);font-weight:600}
.lk{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.lk:last-child{border-bottom:0}
.lk .grow{flex:1;min-width:0}
.lk .rel{font-size:12px;color:var(--muted)}
.stars{display:inline-flex;gap:2px;color:var(--line-strong);font-size:15px;line-height:1}
.stars .on{color:var(--amber)}
.stars button{all:unset;cursor:pointer;font-size:26px;padding:0 2px;color:var(--line-strong)}
.stars button.on{color:var(--amber)}
.stars button:focus-visible{outline:2px solid var(--accent)}
.bell{position:relative}
.bell .dotn{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.notif-drop{position:absolute;right:0;top:48px;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30}
.note{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.note:last-child{border-bottom:0}
.note .by{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.note .by .av{width:24px;height:24px;font-size:10px}
.sig{width:100%;height:180px;border:1.5px dashed var(--line-strong);border-radius:10px;background:var(--surface-2);touch-action:none;cursor:crosshair;display:block}
.addr{display:grid;grid-template-columns:1fr 2fr 90px 1fr 70px 1fr auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:10px}
@media (max-width:1000px){.addr{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
.lk-add{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--surface-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
.tl .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.tl .dot.in{background:var(--blue-bg);color:var(--blue)}
.tl .dot.out{background:var(--amber-bg);color:var(--amber)}

/* filters */
.flt{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}
.flt-panel{position:sticky;top:88px;display:flex;flex-direction:column}
.flt-panel .fsec{padding:16px 18px;gap:10px}
.active-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.active-f .tag{height:28px;font-size:12px}
.active-f .tag button{all:unset;cursor:pointer;display:grid;place-items:center}

/* cassa */
.pos{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:24px;align-items:start}
.scan{display:flex;gap:10px}
.scan .in{height:56px;font-size:16px;padding-left:48px}
.scan-wrap{position:relative;flex:1}
.scan-wrap svg.i{position:absolute;left:16px;top:19px;color:var(--muted)}
.receipt{position:sticky;top:88px}
.ritem{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);align-items:flex-start}
.ritem .grow{flex:1;min-width:0}
.ritem .p{font-weight:600;white-space:nowrap}
.tot{display:flex;flex-direction:column;gap:6px;padding:16px 20px;border-top:1px solid var(--line)}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-family:var(--serif);font-size:28px;font-weight:500;color:var(--ink)}
.pay{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 20px 16px}
.pay button{height:48px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600}
.pay button.on{border-color:var(--accent);background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px var(--accent)}

/* login */
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);min-height:100vh;min-height:100dvh}
.login-art{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;justify-content:space-between;padding:48px;gap:24px;--logo-a:#fff;--logo-b:#bfe0d6;position:relative;overflow:hidden}
.login-art .logo{height:200px}
.login-art .dial{position:absolute;right:-180px;bottom:-180px;width:520px;height:520px;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.login-art .dial::before{content:"";position:absolute;inset:40px;border-radius:50%;border:1px dashed rgba(255,255,255,.12)}
.login-art p{max-width:34ch;color:var(--side-muted);margin:0}
.login-art h2{font-family:var(--serif);font-size:34px;line-height:1.1}
.login-form{padding:48px;display:flex;flex-direction:column;gap:20px;justify-content:center;max-width:460px;width:100%;margin:0 auto}
.login-form h1{font-family:var(--serif);font-size:30px;line-height:1.1}
.pw{position:relative}
.pw .in{padding-right:48px}
.pw button{all:unset;cursor:pointer;position:absolute;right:6px;top:6px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:6px}
.pw button:focus-visible{outline:2px solid var(--accent)}
.bq{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bq button{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);display:flex;flex-direction:column;gap:2px}
.bq button b{font-weight:600}
.bq button small{color:var(--muted);font-size:12px}
.bq button.on{border-color:var(--accent);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.bq button:focus-visible{outline:2px solid var(--accent)}
.ops{display:flex;flex-wrap:wrap;gap:10px}
.ops button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600}
.ops button.on{border-color:var(--accent);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.pin{display:flex;gap:14px;align-items:center}
.pin i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong)}
.pin i.f{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.pad button{height:56px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:500}
.pad button:hover{border-color:var(--accent)}

/* autoreg */
.auto{min-height:100vh;min-height:100dvh;background:var(--surface);display:flex;flex-direction:column;align-items:center;padding:32px 16px 64px}
.auto-top{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center}
.auto-card{width:100%;max-width:620px;display:flex;flex-direction:column;gap:26px;margin-top:8px}
.auto-card .logo{height:150px;align-self:center}
.auto-card h1{font-family:var(--serif);font-size:34px;text-align:center;line-height:1.1}
.auto-card .lead{text-align:center;color:var(--muted);margin:0 auto;max-width:48ch}
.steps{display:flex;gap:10px;justify-content:center;align-items:center}
.steps span{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--faint)}
.steps span i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-style:normal;font-size:12px}
.steps span.on{color:var(--brand)}
.steps span.on i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps hr{width:48px;border:0;border-top:1px solid var(--line-strong);margin:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.demo-tag{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);background:var(--amber-bg);padding:4px 10px;border-radius:99px}

/* modal + drawer + toast */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.25);width:100%;max-width:620px;max-height:calc(100vh - 48px);display:flex;flex-direction:column}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h2{font-family:var(--serif);font-size:22px;flex:1}
.modal-b{padding:20px 22px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px;flex-wrap:wrap}
.modal-f .auto-info{margin-right:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.picklist{border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto}
.picklist .row{padding:10px 14px;cursor:pointer}
.picklist .row:hover,.picklist .row.on{background:var(--brand-soft)}
.picked{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--accent);border-radius:10px;background:var(--brand-soft)}
.picked .grow{flex:1}
.notes-fab{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:99px;background:var(--ink);color:var(--bg);border:0;font-weight:600;box-shadow:var(--shadow)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:45;box-shadow:-12px 0 40px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer .modal-h{padding:18px 20px}
.drawer-b{padding:4px 20px 24px;overflow:auto}
.drawer-b h4{margin:18px 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.drawer-b ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.drawer-b li{line-height:1.45}
.drawer-b .open li::marker{content:"? ";color:var(--amber);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast svg.i{color:var(--brand-2)}

@media (max-width:1180px){
  .qa,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(2){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .grid2,.pos{grid-template-columns:minmax(0,1fr)}
  .receipt{position:static}
  .flt{grid-template-columns:minmax(0,1fr)}
  .flt-panel{position:static}
}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:48;width:260px;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax var(--overlay)}
  .top .menu-btn{display:inline-flex}
  .top{padding:10px 16px;flex-wrap:wrap}
  .top .hide-s{display:none}
  .content{padding:20px 16px}
  .login{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .login-art{padding:32px 24px}
  .login-art .logo{height:120px}
  .login-form{padding:32px 16px}
  .oneclick{min-width:0;width:100%}
}
@media (max-width:560px){
  .qa{grid-template-columns:minmax(0,1fr)}
  .seg{grid-auto-flow:row;grid-template-columns:1fr}
  .bq{grid-template-columns:minmax(0,1fr)}
  .pda{flex-wrap:wrap}
  .pda .act{align-items:flex-start;width:100%}
  .chead h1{font-size:26px}
  .pad{grid-template-columns:repeat(3,64px)}
}
/* riparazioni */
.dotl{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.mini-steps{display:flex;gap:3px;margin-top:6px}
.mini-steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.mini-steps i.done{background:var(--ok)} .mini-steps i.cur{background:var(--accent)} .mini-steps i.skip{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 5px)}
.steps5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.st{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
.st .n{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--faint)}
.st b{font-size:13.5px;font-weight:600} .st small{font-size:12px;color:var(--muted)}
.st.done{background:var(--ok-bg);border-color:transparent} .st.done small,.st.done .n{color:var(--ok)}
.st.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)} .st.cur .n{color:var(--accent)}
.st.skip{border-style:dashed;background:transparent;opacity:.65}
.task{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);cursor:pointer;min-height:52px}
.task input{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}
.task:hover{background:var(--surface-2)}
.voce{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.voce:last-child{border-bottom:0}
.voce .grow,.task .grow{flex:1;min-width:0}
.kv{margin:0}
.voce input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}
.voce-add{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:8px}
.rip-tipi{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:row}
.rip-tipi button{align-items:flex-start;text-align:left;justify-content:flex-start;padding:12px 14px}
.rip-tipi button small{font-weight:500;color:var(--muted);font-size:12px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.th{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);flex:none}
.th.sm{width:64px;height:64px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .ph{width:100%;height:100%;display:grid;place-items:center;background:var(--surface-2);color:var(--faint)}
.th button{all:unset;cursor:pointer;position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.th button svg.i{width:14px;height:14px}
.th.add{border:1.5px dashed var(--line-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--accent);font-size:12px;background:var(--surface)}
.th.add svg.i{width:26px;height:26px}
.att{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.att .tag button{all:unset;cursor:pointer;display:grid;place-items:center}
.paper{background:#fff;color:#1a1a1a;border:1px solid var(--line);border-radius:8px;padding:22px 24px;font-size:12.5px;line-height:1.5}
.paper h4{margin:14px 0 2px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#666}
.paper p{margin:0} .paper .faint{color:#777}
.labels{display:flex;flex-wrap:wrap;gap:14px}
.label-prev{background:#fff;color:#1a1a1a;border:1.5px dashed #bbb;border-radius:8px;padding:12px 14px;width:250px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.lbl-k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#777;margin-bottom:4px}
.bars{height:26px;margin-top:8px;background:repeating-linear-gradient(90deg,#1a1a1a 0 2px,transparent 2px 4px,#1a1a1a 4px 5px,transparent 5px 8px)}
@media (max-width:960px){.steps5{grid-template-columns:repeat(5,minmax(150px,1fr));overflow-x:auto;padding-bottom:4px}.rip-tipi{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.rip-tipi{grid-template-columns:minmax(0,1fr)}.voce-add{grid-template-columns:minmax(0,1fr) 90px}.voce-add .btn{grid-column:1/-1}}
@media print{.notes-fab,.no-print,.side,.top,.modal-h,.modal-f,.modal .field{display:none!important}body:has(.overlay) #app{display:none}.overlay{position:static;background:none;padding:0}.modal{box-shadow:none;max-height:none}.auto{padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------------- helpers ---------------- */
const C = id => clients.find(c => c.id === id);
const P = id => products.find(p => p.id === id);
const fullName = c => c ? `${c.nome} ${c.cognome}` : '';
const initials = c => ((c.nome||'?')[0] + (c.cognome||'')[0]).toUpperCase();
const opInitials = n => n.split(' ').map(x => x[0]).join('');
const dt = s => new Date(s.length <= 10 ? s + 'T12:00' : s);
const fmtD = s => s ? dt(s).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
const fmtT = s => dt(s).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const fmtDT = s => sameDay(s) ? 'Oggi, ' + fmtT(s) : fmtD(s) + ', ' + fmtT(s);
const sameDay = s => dt(s).toDateString() === NOW.toDateString();
const dday = s => Math.round((new Date(dt(s).toDateString()) - new Date(NOW.toDateString())) / 86400000);
const daysAgo = s => -dday(s);
const rel = s => { const n = daysAgo(s); if (n <= 0) return 'oggi'; if (n === 1) return 'ieri'; if (n < 30) return n + ' giorni fa'; if (n < 365) { const m = Math.round(n/30); return m === 1 ? '1 mese fa' : m + ' mesi fa'; } const y = Math.floor(n/365); return y === 1 ? '1 anno fa' : y + ' anni fa'; };
const eur = n => n.toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const nowISO = () => '2026-09-24T' + fmtT(NOW.toISOString());
const clientEvents = id => events.filter(e => e.clientId === id).sort((a,b) => dt(b.date) - dt(a.date));
const lastVisit = id => clientEvents(id).find(e => e.type === 'visita');
const lastContact = id => clientEvents(id)[0];
const clientPurchases = id => purchases.filter(p => p.clientId === id).sort((a,b) => dt(b.date) - dt(a.date));
const lastPurchase = id => clientPurchases(id)[0];
const clientPdas = id => pdas.filter(p => p.clientId === id);
const openPdas = () => pdas.filter(p => ['aperta','preordine'].includes(p.stato));
const spent = id => purchases.filter(p => p.clientId === id).reduce((a, p) => a + p.price, 0);
const tierOf = id => TIERS.find(t => spent(id) >= t.min);
const tierTag = id => { const t = tierOf(id); return t ? `<span class="tag" style="color:${t.c};border-color:currentColor;background:transparent" title="Fascia calcolata sugli acquisti: ${eur(spent(id))}"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 13.9 7 22l5-3 5 3-1.5-8.1"/></svg>${t.n}</span>` : ''; };
const stars = (n, act) => `<span class="stars" ${act ? 'role="radiogroup" aria-label="Valutazione venditore"' : ''}>${[1,2,3,4,5].map(i => act ? `<button type="button" data-act="${act}" data-v="${i}" aria-label="${i} su 5" class="${i <= n ? 'on' : ''}">★</button>` : `<span class="${i <= n ? 'on' : ''}">★</span>`).join('')}</span>`;
const sleeping = id => { const e = lastContact(id); return daysAgo(e ? e.date : C(id).since) > 180; };
const unread = () => NOTIFS.filter(n => !n.read).length;
const compatible = pda => !['aperta','preordine'].includes(pda.stato) ? [] : products.filter(p => p.brand === pda.brand && !p.reservedFor && ['disponibile','in_arrivo'].includes(p.stato) && (pda.ref ? p.ref === pda.ref : p.modello.toLowerCase().includes(pda.modello.toLowerCase())));
const clientLinks = id => links.map((l, i) => ({l, i})).filter(({l}) => l.from === id || l.to === id).map(({l, i}) => l.from === id ? {label:l.type, other:C(l.to), i} : {label:l.back || backOf(l.type), other:C(l.from), i});
const birthText = b => { if (!b || (!b.d && !b.y && !b.decade)) return null; const dm = b.d ? `${b.d} ${MESI[b.m-1]}` : ''; if (b.y) return `${dm} ${b.y}`.trim(); if (b.decade) return `${dm}${dm ? ' · ' : ''}${b.decade}`; return dm; };
const sourceTag = c => c.source === 'Autoregistrazione' ? `<span class="tag blue">${ic('send')}Autoregistrato online</span>` : c.source === 'Legame' ? `<span class="tag">${ic('link')}Creato da legame</span>` : '';
const PDA_ST = {aperta:['Manifestazione','amber'],preordine:['Preordine','blue'],assegnata:['Associata','ok'],venduta:['Ordine',''],annullata:['Annullata','red']};
const stateTag = p => `<span class="tag ${PDA_ST[p.stato][1]}">${PDA_ST[p.stato][0]}</span>`;
const prodState = p => p.stato === 'disponibile' ? '<span class="tag ok">Disponibile</span>' : p.stato === 'in_arrivo' ? `<span class="tag blue">In arrivo ${fmtD(p.arrivo).slice(0,5)}</span>` : p.stato === 'riservato' ? `<span class="tag amber">Riservato a ${esc(fullName(C(p.reservedFor)))}</span>` : '<span class="tag">Venduto</span>';
const avatar = (c, cls='') => c.incomplete && !c.email ? `<span class="av ghost ${cls}">${initials(c)}</span>` : `<span class="av ${cls}">${initials(c)}</span>`;
const opts = (arr, sel, empty) => (empty !== undefined ? `<option value="">${empty}</option>` : '') + arr.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');

function toast(msg){
  const r = document.getElementById('toast-root');
  r.innerHTML = `<div class="toast" role="status">${ic('check')}${msg}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = '', 2800);
}

const RIP_VIEWS = ['riparazioni','rip-new','busta'];
function render(){
  const app = document.getElementById('app');
  if (RIP_VIEWS.includes(S.view)) document.documentElement.dataset.area = 'rip'; else delete document.documentElement.dataset.area;
  if (S.view === 'login') app.innerHTML = vLogin();
  else if (S.view === 'auto') app.innerHTML = vAuto();
  else if (S.view === 'prev') app.innerHTML = vPrev();
  else app.innerHTML = shell(({dashboard:vDash,clienti:vClienti,cliente:vCliente,nuovo:vNuovo,prodotti:vProdotti,cassa:vCassa,passaggi:vPassaggi,pda:vPda,riparazioni:vRip,'rip-new':vRipNew,busta:vBusta})[S.view]());
  renderDrawer();
  if (S.view === 'clienti') renderResults();

function filteredClients(){
  const f = S.f, q = f.q.trim().toLowerCase();
  return clients.filter(c => {
    if (q && !(`${c.nome} ${c.cognome} ${c.email} ${c.email2} ${c.tel} ${c.azienda} ${c.notes.map(n => n.text).join(' ')}`.toLowerCase().includes(q))) return false;
    if (f.tipo && c.tipo !== f.tipo) return false;
    if (f.tier && tierOf(c.id)?.n !== f.tier) return false;
    if (f.rating && (c.rating || 0) < +f.rating) return false;
    if (f.lingua && c.lingua !== f.lingua) return false;
    if (f.ibrand && !c.brands.includes(f.ibrand)) return false;
    if (f.pref && !clientPdas(c.id).some(p => p.ref.toLowerCase().includes(f.pref.toLowerCase()))) return false;
    const ps = clientPurchases(c.id);
    if (f.brand && !ps.some(p => p.brand === f.brand)) return false;
    if (f.modello && !ps.some(p => p.modello.toLowerCase().includes(f.modello.toLowerCase()))) return false;
    if (f.ref && !ps.some(p => p.ref.toLowerCase().includes(f.ref.toLowerCase()))) return false;
    if (f.seller && !ps.some(p => p.seller === f.seller && (!f.brand || p.brand === f.brand))) return false;
    if (f.last) { const lp = ps[0]; const d = lp ? daysAgo(lp.date) : null;
      if (f.last === 'mai' && lp) return false;
      if (f.last === '12' && !(lp && d <= 365)) return false;
      if (f.last === '1-5' && !(lp && d > 365 && d <= 1826)) return false;
      if (f.last === '5' && !(lp && d > 1826)) return false; }
    if (f.visit) { const v = lastVisit(c.id); if (f.visit === '30' && !(v && daysAgo(v.date) <= 30)) return false; if (f.visit === '180' && v && daysAgo(v.date) <= 180) return false; if (f.visit === 'sleep' && !sleeping(c.id)) return false; }
    if (f.boutique && c.boutique !== f.boutique) return false;
    if (f.interest && !c.interests.includes(f.interest)) return false;
    if (f.prof && c.prof !== f.prof) return false;
    if (f.celeb && c.celeb !== f.celeb) return false;
    return true;
  });
}

    return `<div class="st ${cls}"><span class="n">STEP ${i + 1}</span><b>${esc(s.n)}</b><small>${sk ? esc(sk) : cls === 'done' ? 'Completato' : `${d} di ${tot} eseguite`}</small></div>`; }).join('')}</div>

function taskList(r, si){
  const s = rSteps(r)[si];
  return `<div>${s.t.map((t, ti) => { const d = r.done[tk(si, ti)]; return `<label class="task"><input type="checkbox" data-act="rb-task" data-id="${r.id}" data-k="${tk(si, ti)}" ${d ? 'checked' : ''}><span class="grow" style="${d ? 'color:var(--muted)' : ''}">${esc(t)}</span>${d ? `<span class="faint" style="font-size:12px">${d.date ? fmtDT(d.date) + ' · ' + esc(d.by) : 'Eseguita'}</span>` : '<span class="tag red" style="height:22px">Da fare</span>'}</label>`; }).join('')}</div>`;
}
function stepPanel(r){
  const s = rSteps(r)[r.step], name = s.n;
  if (name === 'Preventivo' || (name === 'Valutazione' && r.tipo === 'CPO')) {
    const v = r.prev.voci, lbl = r.tipo === 'CPO' ? 'offerta' : 'preventivo';
    return `<div class="card-b stack" style="gap:12px;border-top:1px solid var(--line)">

      <div class="voce-add"><input class="in" id="pv-d" placeholder="${r.tipo === 'CPO' ? 'Es. offerta di acquisto' : 'Es. revisione completa movimento'}"><input class="in num" id="pv-p" inputmode="decimal" placeholder="€"><button class="btn" data-act="pv-add" data-id="${r.id}">${ic('plus')}Aggiungi</button></div>
      <p class="faint" style="margin:0;font-size:12px">Il ${lbl} si può aggiornare anche dopo l'invio, se il laboratorio trova altri problemi.</p>
      <div style="display:flex;justify-content:flex-end"><button class="btn btn-primary" data-act="pv-send" data-id="${r.id}" ${v.length ? '' : 'disabled'}>${ic('send')}Invia ${lbl} al cliente</button></div>
    </div>`;
  }
  if (name === 'Risposta cliente') {
    return `<div class="card-b stack" style="gap:12px;border-top:1px solid var(--line)">
      <div class="banner info">${ic('link')}<div class="grow"><p>${r.tipo === 'CPO' ? 'Offerta inviata' : 'Preventivo inviato'} con link privato <b class="mono">${esc(r.prev.link || '')}</b>. Il cliente sceglie le voci online, oppure accede con email e password. Una conferma al telefono non vale.</p></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-go="prev" data-id="${r.id}">${ic('arrow')}Apri la vista del cliente (demo)</button><button class="btn" data-act="pv-resend" data-id="${r.id}">${ic('mail')}Invia un sollecito</button><span class="sp" style="flex:1"></span><button class="btn btn-ghost" data-act="pv-refuse" data-id="${r.id}">Il cliente ha rifiutato</button></div>
    </div>`;
  }
  if (name === 'Lavorazione' || name === 'Lavorazione e certificazione' || name === 'Lavori da fare') {
    return `<div class="card-b stack" style="gap:12px;border-top:1px solid var(--line)">
      <div class="label">Documenti di scarico e certificazioni · più file per busta</div>
      <div class="att">${(r.att || []).map(a => `<span class="tag">${ic('clip')}${esc(a)}</span>`).join('') || '<span class="faint">Nessun file allegato</span>'}<label class="btn btn-sm">${ic('clip')}Allega file<input type="file" class="rb-att" data-id="${r.id}" multiple hidden></label></div>
      <p class="faint" style="margin:0;font-size:12px">Lo scarico dei componenti si fa sul gestionale con il numero di busta <b class="mono">${esc(r.busta)}</b> (via eCube).</p>
    </div>`;
  }
  if (name === 'Riconsegna') {
    const tot = r.esito === 'rifiutato' ? (r.costoPrev || 0) : r.prev?.stato === 'accettato' ? prevTot(r, true) : 0;

      ${r.esito === 'rifiutato' ? `<div class="banner">${ic('info')}<div class="grow"><p>Preventivo rifiutato: si restituisce l'orologio. Costo del solo preventivo: <b>${eur(r.costoPrev || 0)}</b>.</p></div></div>` : ''}
      <div class="fgrid"><label class="field"><span>Numero scontrino</span><input class="in mono" id="rb-sn" value="${esc(r.scontrino?.n || '')}" placeholder="Es. 0042-0815"></label><label class="field"><span>Totale scontrino</span><input class="in num" id="rb-st" value="${tot}" inputmode="decimal"></label></div>

    </div>`;
  }
  return '';
}
function prevCard(r){
  if (!r.prev?.voci?.length || ['bozza'].includes(r.prev.stato) && r.step === 1) return '';
  const st = {inviato:['Inviato, in attesa','amber'],accettato:['Accettato','ok'],rifiutato:['Rifiutato','red'],bozza:['In bozza','']}[r.prev.stato] || ['',''];

function logCard(r){
  return `<section class="card"><div class="card-h">${ic('clock')}<h2>Storico della busta</h2></div><div class="timeline">${[...r.log].sort((a,b) => dt(b.date) - dt(a.date)).map(l => `<div class="tl"><span class="dot">${ic(l.by === 'Cliente' ? 'users' : 'check')}</span><div><b>${esc(l.t)}</b><div class="muted" style="font-size:12.5px">${fmtDT(l.date)} · ${esc(l.by)}</div></div></div>`).join('')}</div></section>`;
}
function ripLog(r, t, by = S.operator){ r.log.push({date:nowISO(), by, t}); }
/* avanza quando tutte le attività dello step sono eseguite, saltando gli step non previsti */
function ripAdvance(r){
  const st = rSteps(r);
  while (r.step < st.length && (st[r.step].skip || st[r.step].t.every((_, ti) => r.done[tk(r.step, ti)]))) {
    if (r.step === st.length - 1) { r.closed = true; r.ubic = r.tipo === 'CPO' || r.tipo === 'Conto vendita' ? r.ubic : 'Riconsegnato al cliente'; ripLog(r, r.tipo === 'CPO' || r.tipo === 'Conto vendita' ? 'Orologio in vendita: busta chiusa' : 'Busta chiusa'); return true; }
    r.step++;
    if (!st[r.step].skip) { toast(`Passata allo step ${r.step + 1}: ${st[r.step].n}`); return true; }
  }
  return false;
}
function ripTick(r, si, ti, on = true){ const k = tk(si, ti); if (on) r.done[k] = {date:nowISO(), by:S.operator}; else delete r.done[k]; }
function ripPlaceholderCliente(c){

    <div class="list">${rs.length ? rs.map(r => `<div class="row click" data-go="busta" data-id="${r.id}">${ic('watch')}<div class="grow"><div class="t"><span class="mono">${esc(r.busta)}</span> · ${esc(objName(r))}</div><div class="s">${esc(r.tipo)} · ${esc(r.motivo)} · accettata ${fmtD(r.acc)} in ${esc(r.boutique)}</div></div>${light(r)}${ic('arrow')}</div>`).join('') : '<div class="empty">Nessuna riparazione per questo cliente.</div>'}</div></section>`;
}

      <p class="faint no-print" style="margin:0;font-size:12px;text-align:center">Ha un account Verga? Può ritrovare i suoi preventivi anche accedendo con email e password.</p>

function initSig(){
  const cv = document.getElementById('sig'); if (!cv || cv.dataset.ready) return;
  cv.dataset.ready = '1'; const r = cv.getBoundingClientRect(); const k = window.devicePixelRatio || 1;
  cv.width = r.width * k; cv.height = r.height * k; const g = cv.getContext('2d'); g.scale(k, k);
  g.lineWidth = 2.2; g.lineCap = 'round'; g.strokeStyle = getComputedStyle(document.body).color;
  let on = false;
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.addEventListener('pointerdown', e => { on = true; cv.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(...pt(e)); });
  cv.addEventListener('pointermove', e => { if (!on) return; g.lineTo(...pt(e)); g.stroke(); cv.dataset.signed = '1'; });
  ['pointerup','pointercancel'].forEach(t => cv.addEventListener(t, () => on = false));
}
